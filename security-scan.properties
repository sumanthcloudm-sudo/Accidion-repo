# Accidion Security Scanning Configuration

# Application root directory
PROJECT_ROOT=

# Security report output directory
OUTPUT_DIR=

# Security scanners to execute
# Available: all, gitleaks, semgrep, dependency-check, syft, grype, checkov
# Multiple scanners: gitleaks,semgrep
SCANNERS=all

# Existing local Docker image to scan
DOCKER_IMAGE=

# Build and scan the application Docker image
BUILD_IMAGE=false
