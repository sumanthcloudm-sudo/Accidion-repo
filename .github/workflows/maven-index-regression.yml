name: Maven index regression
on:
  pull_request:
  push:
    branches: [fix/maven-report-processing]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n security-scan.sh
      - run: python -m py_compile starter_kit.py starter_findings.py starter_install.py
      - run: python -m unittest discover -s tests -p test_maven_index.py -v
